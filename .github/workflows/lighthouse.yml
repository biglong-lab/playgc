name: Lighthouse CI

on:
  pull_request:
    branches: [main]
  # 每週一 03:00 UTC 的 main 基準排程暫停（2026-07-29）：
  # 此 workflow 長期 100% 失敗，每週固定燒 Actions 分鐘數卻從未產出可用基準。
  # 修好後把下面兩行取消註解即可恢復。
  # schedule:
  #   - cron: "0 3 * * 1"
  workflow_dispatch:

# 同一 PR 連續 push 只保留最新一次審計（不含部署，取消安全）
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    name: Lighthouse mobile audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          NODE_ENV: production
          # 跳過 server bundle、只測 client
          SKIP_SERVER_BUILD: "1"

      - name: Lighthouse audit (production URL)
        id: lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://game.homi.cc/
            https://game.homi.cc/f/JIACHUN/home
            https://game.homi.cc/pitch
            https://game.homi.cc/showcase
          configPath: ./.github/lighthouse/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Format scores for PR comment
        id: format
        if: github.event_name == 'pull_request'
        run: |
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo "## 🔆 Lighthouse 行動裝置分數" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "| URL | Performance | PWA | Accessibility | Best Practices | SEO |" >> $GITHUB_OUTPUT
          echo "|-----|-------------|-----|---------------|----------------|-----|" >> $GITHUB_OUTPUT
          echo "報告連結（artifacts）：${{ steps.lighthouse.outputs.links }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment PR with Lighthouse summary
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: lighthouse-ci
          message: ${{ steps.format.outputs.summary }}
